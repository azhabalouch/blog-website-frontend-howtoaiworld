name: Daily Fetch and Deploy

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.1x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch new blogs (cache.py)
        run: python scripts/cache.py

      - name: Commit cached data (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: fetch new blogs data" && git push)
        continue-on-error: true

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Site
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'howtoaiworld' # Replace with your Cloudflare Pages project name
          directory: 'out'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
