name: Update Sitemap on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Update sitemap.xml
        run: |
          python generate-static-post-pages.py
          python update-sitemap.py

      - name: Check if sitemap was modified
        id: check-changes
        run: |
          if git diff --quiet sitemap.xml posts/; then
            echo "sitemap_changed=false" >> $GITHUB_OUTPUT
            echo "No changes to sitemap.xml"
          else
            echo "sitemap_changed=true" >> $GITHUB_OUTPUT
            echo "Sitemap.xml was updated"
          fi
      
      - name: Commit and push sitemap changes
        if: steps.check-changes.outputs.sitemap_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml posts/
          git commit -m "Auto-update sitemap and static posts [skip ci]"
          git push origin main
