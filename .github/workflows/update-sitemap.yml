name: Update Sitemap on Push

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch last 2 commits to compare changes
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Update sitemap.xml
        run: |
          python update-sitemap.py
      
      - name: Check if sitemap was modified
        id: check-changes
        run: |
          if git diff --quiet sitemap.xml; then
            echo "sitemap_changed=false" >> $GITHUB_OUTPUT
            echo "No changes to sitemap.xml"
          else
            echo "sitemap_changed=true" >> $GITHUB_OUTPUT
            echo "Sitemap.xml was updated"
          fi
      
      - name: Commit and push sitemap changes
        if: steps.check-changes.outputs.sitemap_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          git commit -m "🤖 Auto-update sitemap.xml lastmod dates [skip ci]"
          git push
