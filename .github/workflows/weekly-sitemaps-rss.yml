name: Weekly Generate Sitemaps & RSS

on:
  schedule:
    - cron: '50 11 * * 6' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Sitemaps
        run: python scripts/generate_sitemaps.py

      - name: Generate RSS
        run: python scripts/generate_rss.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap*.xml public/rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate sitemaps and rss weekly" && git push)
