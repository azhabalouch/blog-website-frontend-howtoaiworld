<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover our featured articles - our hand-picked selection of the best content on HowToAiWorld.">
    <meta name="robots" content="index, follow">
    <title>Featured Articles - HowToAiWorld</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://howtoaiworld.com/featured.html">
</head>
<body>
    <!-- Header will be loaded dynamically -->

    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <section class="main-articles">
                    <!-- Dynamic featured content will be loaded here by blog-loader.js -->
                    <div style="text-align: center; padding: 60px 20px;">
                        <p style="font-size: 18px; color: #666;">Loading featured articles...</p>
                    </div>
                </section>

                <aside class="sidebar">
                    <div class="sidebar-section ad-section" aria-label="Advertisement">
                        <p class="ad-label">Advertisement</p>
                        <div class="ad-placeholder">
                            <p>Ad Space<br>300x250</p>
                        </div>
                    </div>

                    <div class="sidebar-section categories-section">
                        <h3 class="sidebar-title">Categories</h3>
                        <ul class="categories-list" id="categories-list">
                            <!-- Categories will be dynamically loaded -->
                        </ul>
                    </div>

                    <div class="sidebar-section">
                        <h3 class="sidebar-title">Popular Categories</h3>
                        <ul id="popular-categories" style="list-style: none; padding: 0;">
                            <!-- Popular categories with counts will be dynamically loaded -->
                        </ul>
                    </div>

                    <div class="sidebar-section newsletter-section">
                        <h3 class="sidebar-title">Subscribe to Newsletter</h3>
                        <form class="newsletter-form" id="newsletterFormFeatured" aria-label="Newsletter subscription form">
                            <label for="newsletter-email-featured" class="sr-only">Email address</label>
                            <input type="email" id="newsletter-email-featured" name="email" placeholder="Enter your email" required aria-required="true">
                            <button type="submit">Subscribe</button>
                            <div id="newsletterMessageFeatured" style="display: none; margin-top: 10px; font-size: 13px;"></div>
                        </form>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded dynamically -->

    <script src="components.js"></script>
    <script src="blog-loader.js"></script>
    <script>
        // Newsletter form handler
        const newsletterFormFeatured = document.getElementById('newsletterFormFeatured');
        if (newsletterFormFeatured) {
            newsletterFormFeatured.addEventListener('submit', function(e) {
                e.preventDefault();
                const messageDiv = document.getElementById('newsletterMessageFeatured');
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#155724';
                messageDiv.textContent = '✓ Successfully subscribed!';
                this.reset();
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            });
        }
    </script>
</body>
</html>
