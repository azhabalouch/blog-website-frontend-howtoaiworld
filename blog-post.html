<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read the full article on HowToAiWorld">
    <meta name="robots" content="index, follow">
    <title id="page-title">Blog Post - HowToAiWorld</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://howtoaiworld.com">
</head>
<body>
    <!-- Header will be loaded dynamically -->

    <main class="main-content" id="main-content" role="main" aria-label="Main content">
        <div class="container">
            <div class="content-grid">
                <section class="main-articles" id="blog-post-container">
                    <!-- Blog post will be loaded here -->
                    <div style="text-align: center; padding: 60px 20px;">
                        <p style="font-size: 18px; color: #666;">Loading article...</p>
                    </div>
                </section>

                <aside class="sidebar">
                    <div class="sidebar-section ad-section" aria-label="Advertisement">
                        <p class="ad-label">Advertisement</p>
                        <div class="ad-placeholder">
                            <p>Ad Space<br>300x250</p>
                        </div>
                    </div>

                    <div class="sidebar-section categories-section">
                        <h3 class="sidebar-title">Categories</h3>
                        <ul class="categories-list" id="categories-list">
                            <!-- Categories will be dynamically loaded -->
                        </ul>
                    </div>

                    <div class="sidebar-section newsletter-section">
                        <h3 class="sidebar-title">Subscribe to Newsletter</h3>
                        <form class="newsletter-form" id="newsletterFormBlog" aria-label="Newsletter subscription form">
                            <label for="newsletter-email-blog" class="sr-only">Email address</label>
                            <input type="email" id="newsletter-email-blog" name="email" placeholder="Enter your email" required aria-required="true">
                            <button type="submit">Subscribe</button>
                            <div id="newsletterMessageBlog" role="status" aria-live="polite" style="display: none; margin-top: 10px; font-size: 13px;"></div>
                        </form>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded dynamically -->

    <script src="components.js"></script>
    <script src="blog-loader.js"></script>
    <script>
        // Load individual blog post
        function loadBlogPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (!postId) {
                window.location.href = 'index.html';
                return;
            }
            
            const post = getPostById(postId);
            
            if (!post) {
                document.getElementById('blog-post-container').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2 style="font-size: 32px; margin-bottom: 20px;">Post Not Found</h2>
                        <p style="font-size: 18px; color: #666; margin-bottom: 30px;">Sorry, the article you're looking for doesn't exist.</p>
                        <a href="index.html" style="display: inline-block; padding: 15px 30px; background-color: #2c2c2c; color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Go to Homepage</a>
                    </div>
                `;
                return;
            }
            
            // Update page title and meta
            document.getElementById('page-title').textContent = `${post.title} - HowToAiWorld`;
            document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt);
            
            // Create article container
            const article = document.createElement('article');
            article.className = 'featured-article';
            
            // Add badges (no featured field in API, so no badges needed)
            let badgesHTML = '';
            
            // Featured image HTML
            const featuredImageHtml = post.featured_image ? 
                `<div class="article-featured-image" style="margin-bottom: 30px; text-align: center;"><img src="${post.featured_image}" alt="${escapeHtml(post.title)}" style="max-width: 100%; height: auto; border-radius: 8px;" /></div>` : '';
            
            // Build article HTML
            article.innerHTML = `
                ${badgesHTML}
                <h1 class="article-title">${escapeHtml(post.title)}</h1>
                <div class="article-meta">
                    <span class="author">By ${escapeHtml(post.author)}</span>
                    <span class="separator">|</span>
                    <time datetime="${formatDateTime(post.date)}">${formatDate(post.date)}</time>
                    <span class="separator">|</span>
                    <a href="index.html?category=${encodeURIComponent(post.category)}" style="color: #c41e3a; text-decoration: none; font-weight: bold;">${escapeHtml(post.category)}</a>
                </div>
                ${featuredImageHtml}
                <div class="article-content">
                </div>
                <div style="margin-top: 40px; padding-top: 30px; border-top: 2px solid #ddd;">
                    <a href="index.html" class="back-to-posts-link">← Back to All Posts</a>
                </div>
            `;
            
            // Set content HTML separately to preserve formatting
            // Remove the h1 title from content since we already display it above
            const contentDiv = article.querySelector('.article-content');
            let contentHtml = post.content;
            
            // Remove the first h1 tag from content to avoid duplication
            if (contentHtml) {
                contentHtml = contentHtml.replace(/<h1[^>]*>.*?<\/h1>/, '');
            }
            
            // Insert content images around the middle of the article
            const tempWrapper = document.createElement('div');
            tempWrapper.innerHTML = contentHtml || '';
            const paragraphs = tempWrapper.querySelectorAll('p');
            if (post.content_images && Array.isArray(post.content_images) && post.content_images.length > 0 && paragraphs.length > 0) {
                const midIndex = Math.floor(paragraphs.length / 2);
                const imageMarkup = post.content_images.map((url, idx) =>
                    `<figure class="content-inline-image"><img src="${url}" alt="${escapeHtml(post.title)} image ${idx + 1}"></figure>`
                ).join('');
                const imageContainer = document.createElement('div');
                imageContainer.innerHTML = imageMarkup;
                paragraphs[midIndex].insertAdjacentElement('afterend', imageContainer);
            }
            
            contentDiv.innerHTML = tempWrapper.innerHTML;
            
            // Add FAQ section if it exists (supports faq or FAQ)
            const faqItems = post.faq || post.FAQ;
            if (faqItems && Array.isArray(faqItems) && faqItems.length > 0) {
                const faqDiv = document.createElement('div');
                faqDiv.className = 'article-faq';
                
                const faqList = faqItems.map((item, idx) => {
                    const q = escapeHtml(item.question || 'Question');
                    const a = escapeHtml(item.answer || '');
                    return `
                        <div class="faq-item" data-index="${idx}">
                            <button class="faq-question" aria-expanded="false" aria-controls="faq-answer-${idx}">
                                <span class="faq-question-text">${q}</span>
                                <span class="faq-toggle" aria-hidden="true">+</span>
                            </button>
                            <div id="faq-answer-${idx}" class="faq-answer" hidden>
                                <p>${a}</p>
                            </div>
                        </div>
                    `;
                }).join('');
                faqDiv.innerHTML = `
                    <div class="faq-heading">
                        <p class="faq-kicker">Need quick answers?</p>
                        <h3>Frequently Asked Questions</h3>
                    </div>
                    <div class="faq-list">${faqList}</div>
                `;
                article.appendChild(faqDiv);
                faqDiv.querySelectorAll('.faq-question').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        const answerId = btn.getAttribute('aria-controls');
                        const answer = faqDiv.querySelector(`#${answerId}`);
                        const isOpen = btn.getAttribute('aria-expanded') === 'true';
                        btn.setAttribute('aria-expanded', String(!isOpen));
                        answer.hidden = isOpen;
                        btn.parentElement.classList.toggle('open', !isOpen);
                    });
                });
            }
            
            // Replace container with article
            document.getElementById('blog-post-container').innerHTML = '';
            document.getElementById('blog-post-container').appendChild(article);
            
            // Load categories
            updateCategoriesSidebar();
        }
        
        // Newsletter form handler
        const newsletterFormBlog = document.getElementById('newsletterFormBlog');
        if (newsletterFormBlog) {
            newsletterFormBlog.addEventListener('submit', function(e) {
                e.preventDefault();
                const messageDiv = document.getElementById('newsletterMessageBlog');
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#155724';
                messageDiv.textContent = '✓ Successfully subscribed!';
                this.reset();
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            });
        }
    </script>
</body>
</html>
