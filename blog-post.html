<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read the full article on HowToAiWorld">
    <meta name="robots" content="index, follow">
    <title id="page-title">Blog Post - HowToAiWorld</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://howtoaiworld.com">
</head>
<body>
    <!-- Header will be loaded dynamically -->

    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <section class="main-articles" id="blog-post-container">
                    <!-- Blog post will be loaded here -->
                    <div style="text-align: center; padding: 60px 20px;">
                        <p style="font-size: 18px; color: #666;">Loading article...</p>
                    </div>
                </section>

                <aside class="sidebar">
                    <div class="sidebar-section trending-section">
                        <h3 class="sidebar-title">Trending Now</h3>
                        <ul class="trending-list" id="trending-sidebar">
                            <!-- Trending posts will be loaded here -->
                        </ul>
                    </div>

                    <div class="sidebar-section ad-section" aria-label="Advertisement">
                        <p class="ad-label">Advertisement</p>
                        <div class="ad-placeholder">
                            <p>Ad Space<br>300x250</p>
                        </div>
                    </div>

                    <div class="sidebar-section categories-section">
                        <h3 class="sidebar-title">Categories</h3>
                        <ul class="categories-list" id="categories-list">
                            <!-- Categories will be dynamically loaded -->
                        </ul>
                    </div>

                    <div class="sidebar-section newsletter-section">
                        <h3 class="sidebar-title">Subscribe to Newsletter</h3>
                        <form class="newsletter-form" id="newsletterFormBlog" aria-label="Newsletter subscription form">
                            <label for="newsletter-email-blog" class="sr-only">Email address</label>
                            <input type="email" id="newsletter-email-blog" name="email" placeholder="Enter your email" required aria-required="true">
                            <button type="submit">Subscribe</button>
                            <div id="newsletterMessageBlog" style="display: none; margin-top: 10px; font-size: 13px;"></div>
                        </form>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded dynamically -->

    <script src="components.js"></script>
    <script src="blog-loader.js"></script>
    <script>
        // Load individual blog post
        function loadBlogPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (!postId) {
                window.location.href = 'index.html';
                return;
            }
            
            const post = getPostById(postId);
            
            if (!post) {
                document.getElementById('blog-post-container').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2 style="font-size: 32px; margin-bottom: 20px;">Post Not Found</h2>
                        <p style="font-size: 18px; color: #666; margin-bottom: 30px;">Sorry, the article you're looking for doesn't exist.</p>
                        <a href="index.html" style="display: inline-block; padding: 15px 30px; background-color: #2c2c2c; color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Go to Homepage</a>
                    </div>
                `;
                return;
            }
            
            // Update page title and meta
            document.getElementById('page-title').textContent = `${post.title} - HowToAiWorld`;
            document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt);
            
            // Create article container
            const article = document.createElement('article');
            article.className = 'featured-article';
            
            // Add badges
            let badgesHTML = '';
            if (post.featured) {
                badgesHTML += '<span style="background-color: #c41e3a; color: #fff; padding: 5px 12px; font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; text-transform: uppercase;">⭐ Featured</span>';
            }
            if (post.trending) {
                badgesHTML += '<span style="background-color: #ff6b35; color: #fff; padding: 5px 12px; font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; text-transform: uppercase; margin-left: 10px;">🔥 Trending</span>';
            }
            
            // Build article HTML
            article.innerHTML = `
                ${badgesHTML}
                <h1 class="article-title">${post.title}</h1>
                <div class="article-meta">
                    <span class="author">By ${post.author}</span>
                    <span class="separator">|</span>
                    <time datetime="${formatDateTime(post.date)}">${formatDate(post.date)}</time>
                    <span class="separator">|</span>
                    <a href="index.html?category=${encodeURIComponent(post.category)}" style="color: #c41e3a; text-decoration: none; font-weight: bold;">${post.category}</a>
                </div>
                <div class="article-content">
                </div>
                <div style="margin-top: 40px; padding-top: 30px; border-top: 2px solid #ddd;">
                    <a href="index.html" style="color: #2c2c2c; text-decoration: none; font-weight: bold;">← Back to All Posts</a>
                </div>
            `;
            
            // Set content HTML separately to preserve formatting
            const contentDiv = article.querySelector('.article-content');
            contentDiv.innerHTML = post.content;
            
            // Replace container with article
            document.getElementById('blog-post-container').innerHTML = '';
            document.getElementById('blog-post-container').appendChild(article);
            
            // Load trending sidebar and categories
            loadTrendingSidebar();
            updateCategoriesSidebar();
        }
        
        function loadTrendingSidebar() {
            const posts = getTrendingPosts(5);
            const trendingList = document.getElementById('trending-sidebar');
            
            if (posts.length === 0) {
                trendingList.innerHTML = '<li style="color: #666;">No trending posts yet</li>';
                return;
            }
            
            trendingList.innerHTML = posts.map(post => 
                `<li><a href="blog-post.html?id=${post.id}">${post.title}</a></li>`
            ).join('');
        }
        
        // Newsletter form handler
        const newsletterFormBlog = document.getElementById('newsletterFormBlog');
        if (newsletterFormBlog) {
            newsletterFormBlog.addEventListener('submit', function(e) {
                e.preventDefault();
                const messageDiv = document.getElementById('newsletterMessageBlog');
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#155724';
                messageDiv.textContent = '✓ Successfully subscribed!';
                this.reset();
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            });
        }
    </script>
</body>
</html>
